<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quote Generator</title>
    <link rel="stylesheet" href="quoteGenerator.css">
</head>

<body>
    <div class="container">
        <h2>Quote Generator</h2>
        <div class="main-container">
            <p class="quote">
                "Be who you are and say what you feel, because those who mind don't matter, and those who matter don't
                mind"
            </p>
            <div class="person-quote">Dr. Seuss</div>
            <div class="year">1950</div>
            <button class="quote-change">New Quote</button>
        </div>
    </div>

    <script src="quoteGenerator.js"></script>
</body>

</html>
